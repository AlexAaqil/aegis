[tool.poetry]
name = "aegis-backend"
version = "0.1.0"
description = "Aegis backend — offline biometric + rule-based fraud detection (MVP)"
authors = ["Aegis <alexwambuik@gmail.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
sqlmodel = "^0.0.27"
pydantic = "^2.12.0"
cryptography = "^43.0.1"
python-multipart = "^0.0.20"
pillow = "^11.0.0"
numpy = ">=2.2.0,<2.3.0"
pydantic-settings = "^2.11.0"
opencv-python = "^4.12.0.88"
pyaudio = "^0.2.14"
requests = "^2.32.5"
scikit-image = "^0.25.2"

[tool.poetry.group.dev.dependencies]
black = "^24.8.0"
isort = "^5.13.2"
flake8 = "^7.1.0"
mypy = "^1.11.0"
pytest = "^8.3.0"
pre-commit = "^3.8.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
